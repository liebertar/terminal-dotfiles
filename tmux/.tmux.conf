# tmux config — Claude Code optimized

# Use 256 colors + true color (outer = xterm-ghostty)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm*:RGB"

# Focus events — TUI 앱(Claude Code 등)이 포커스 변경을 인지하도록
set -g focus-events on
set -as terminal-features ",xterm-ghostty:focus"

# Mouse support (scroll, click, resize panes)
set -g mouse on

# Large scrollback
set -g history-limit 50000

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Faster key repetition
set -sg escape-time 0

# Prefix: Ctrl+A (easier than default Ctrl+B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# Navigate panes: prefix + h/j/k/l (Alt+Arrow는 단어 이동용으로 양보)
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Resize panes with Ctrl+Arrow
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 3
bind -r C-Down resize-pane -D 3

# Status bar
set -g status-style "bg=#d4d48a,fg=#1e1e2e"
set -g status-left "#[fg=#3a3a00,bold] #S "
set -g status-right "#[fg=#3a3a00,bold]#(cd #{pane_current_path}; git symbolic-ref --short HEAD 2>/dev/null || echo '-')  %H:%M "
set -g status-left-length 20
setw -g window-status-current-style "fg=#1e1e2e,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#d19a66"

# Per-pane fixed title bar at top — repo + branch (yellow)
set -g pane-border-status top
set -g pane-border-format '#[bg=#d19a66,fg=#0d1117,bold] #(cd #{pane_current_path}; repo=$(git rev-parse --show-toplevel 2>/dev/null); if [ -n "$repo" ]; then echo "$(basename $repo) [$(git symbolic-ref --short HEAD 2>/dev/null)]"; else basename "#{pane_current_path}"; fi) #[default]'

# Extended keys — Claude Code 이미지 paste 손상 (Issue #43169) 때문에 비활성화
# set -g extended-keys on
# set -as terminal-features ",xterm-ghostty:extkeys"
# set -as terminal-features ",xterm*:extkeys"

# Clipboard — 마우스 드래그 선택 → 시스템 클립보드 (선택 유지, 클릭 시 해제)
set -g set-clipboard on
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"

# copy-mode에서 클릭 시 커서 이동 (copy-mode 유지, 스크롤 위치 유지)
bind-key -T copy-mode    MouseDown1Pane select-pane \; send-keys -X select-line \; send-keys -X clear-selection
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X select-line \; send-keys -X clear-selection

# TUI 앱(alternate screen)에서 마우스 이벤트가 copy-mode로 빠지는 것 방지
# 스크롤: alternate screen이면 앱에 패스스루, 아니면 copy-mode 진입
bind -T root WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -T root WheelDownPane if-shell -F "#{alternate_on}" "send-keys -M" "send-keys -M"
# 클릭: alternate screen(TUI)이면 pane 선택만, 일반 쉘이면 기본 동작(드래그 선택 가능)
# 클릭: alternate screen(TUI)이면 pane 선택만, 일반 쉘이면 기본 동작(드래그 선택 가능)
bind -T root MouseDown1Pane if-shell -F "#{alternate_on}" "select-pane -t=" "select-pane -t=; send-keys -M"

# Passthrough — 이미지/특수 escape sequence 통과 허용
set -g allow-passthrough on

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"
